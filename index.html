<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>อินไซต์อาเซียน ส31221 · สื่อการสอนรายคาบ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Sarabun:wght@400;600;700&display=swap">
<style>
/* Period page: teacher projector mode (stage rail + content/game stage + team score bar) and student mode (individual exit game on phones).
   Look: navy classroom-projector theme with paper cards, gold accents for scores. */
:root{
  --bg:#0B2236; --bg2:#123150; --line:#2A5480; --paper:#FBF8F1; --ink:#13283B; --muted:#5E6F80;
  --gold:#F2B630; --gold-d:#A8740E; --good:#2F8A62; --bad:#C9503A; --u1:#1F5FAE;
  --display:'Kanit','Sarabun',Tahoma,sans-serif; --body:'Sarabun','Kanit',Tahoma,sans-serif;
  --fs:clamp(15px,calc(.9vw + .9vh),28px);
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(ellipse at 30% 20%,#17406A 0%,var(--bg) 65%);background-color:var(--bg);color:#EAF1F6;font-family:var(--body);overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #fff;outline-offset:2px}
svg.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.fl{width:1.6em;height:1.2em;object-fit:cover;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.25);vertical-align:-.2em}
/* teacher layout */
.T{height:100dvh;display:grid;grid-template-rows:auto auto 1fr auto;font-size:var(--fs)}
.top{display:flex;align-items:center;gap:12px;padding:8px max(14px,env(safe-area-inset-right,0px)) 6px max(14px,env(safe-area-inset-left,0px))}
.brand{font-family:var(--display);font-weight:600;font-size:17px;line-height:1.15;margin-right:auto;min-width:0}
.brand b{color:var(--gold)}
.brand small{display:block;font-weight:400;font-size:12.5px;color:#A9C0D3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{display:inline-flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:6px 11px;font-size:14px;white-space:nowrap}
.tbtn:hover{background:#1A4068}
.tbtn:disabled{opacity:.4;cursor:default}
.clock{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:600;font-size:18px;min-width:84px;justify-content:center}
.clock.low{background:var(--bad);border-color:var(--bad)}
.rail{display:flex;gap:4px;padding:0 max(14px,env(safe-area-inset-right,0px)) 6px max(14px,env(safe-area-inset-left,0px));overflow-x:auto;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail button{flex:1 0 auto;border:0;border-radius:8px;background:rgba(255,255,255,.07);color:#A9C0D3;font-size:12.5px;padding:5px 9px;text-align:left;line-height:1.2;white-space:nowrap}
.rail button b{font-family:var(--display);color:#fff;margin-right:4px}
.rail button.done{background:rgba(242,182,48,.18);color:#F6D98C}
.rail button.now{background:var(--gold);color:#3B2600}
.rail button.now b{color:#3B2600}
.stageWrap{position:relative;min-height:0;display:grid;grid-template-columns:auto 1fr auto;align-items:center}
.nav{width:52px;height:100%;border:0;background:transparent;color:#7E97AD;display:grid;place-items:center;font-size:30px}
.nav:hover:not(:disabled){color:#fff;background:rgba(255,255,255,.04)}
.nav:disabled{opacity:.2;cursor:default}
.stage{height:100%;overflow:auto;padding:1.2vh .4em 2vh;display:flex;flex-direction:column;min-width:0}
.stage>.in{margin:auto 0;width:100%}
.kick{font-family:var(--display);font-size:.72em;letter-spacing:.04em;color:var(--gold);display:flex;align-items:center;gap:.5em;margin-bottom:.15em}
.kick i{font-style:normal;background:rgba(242,182,48,.15);border-radius:999px;padding:.05em .7em;color:#F6D98C}
h1.h{font-family:var(--display);font-weight:600;font-size:1.75em;line-height:1.2;margin:0 0 .45em;color:#fff;text-wrap:balance}
.rule{font-size:.82em;color:#C8D7E3;background:rgba(255,255,255,.06);border-left:4px solid var(--gold);border-radius:6px;padding:.4em .8em;margin:0 0 .7em}
.note{margin-top:.8em;font-size:.7em;color:#A9C0D3}
.note summary{cursor:pointer;color:#C8D7E3;font-family:var(--display)}
.two{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:1.2em;align-items:center}
.vis svg.scene,.vis svg.map{width:100%;height:auto;display:block;border-radius:14px;max-height:46vh;margin:0 auto}
.cover .vis svg.scene{max-height:30vh;width:auto;max-width:100%}
.sig .vis svg.scene{max-height:36vh;width:auto;max-width:100%}
.vis svg.map{background:#EAF3F7}
.vis figcaption{font-size:.62em;color:#A9C0D3;margin-top:.3em}
.vis img.big{height:min(30vh,9em);display:block;margin:auto;border-radius:8px;box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.pts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.45em}
.pts li{background:var(--paper);color:var(--ink);border-radius:12px;padding:.45em .8em .45em 2.2em;position:relative;font-size:.92em;line-height:1.45}
.pts li::before{content:attr(data-n);position:absolute;left:.6em;top:.45em;width:1.15em;height:1.15em;border-radius:50%;background:var(--u1);color:#fff;font-family:var(--display);font-size:.85em;display:grid;place-items:center}
.pts b{color:#0E4C8F}
.ask{margin-top:.8em;background:rgba(242,182,48,.12);border:2px dashed var(--gold);border-radius:12px;padding:.5em .8em;font-family:var(--display);font-size:.9em;color:#FBE6AE}
.signers{display:grid;grid-template-columns:repeat(5,1fr);gap:.5em;margin-top:.8em}
.signer{background:var(--paper);color:var(--ink);border-radius:12px;padding:.5em;text-align:center;font-size:.72em;line-height:1.3}
.signer img{width:3em;height:2.25em;object-fit:cover;border-radius:4px;display:block;margin:0 auto .3em;box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.signer b{font-family:var(--display);display:block;font-size:1.15em}
/* cover */
.cover{text-align:center;max-width:34em;margin:0 auto}
.cover h1.h{font-size:2.6em;margin-bottom:.2em}
.cover .s{font-size:1.05em;color:#C8D7E3;margin:0 0 1em}
.goals{display:grid;gap:.45em;text-align:left;margin:0 auto 1em;max-width:30em}
.goals div{background:rgba(255,255,255,.07);border-radius:10px;padding:.4em .8em;font-size:.82em;display:flex;gap:.6em;align-items:baseline}
.goals div b{color:var(--gold);font-family:var(--display)}
.plan{display:flex;flex-wrap:wrap;gap:.35em;justify-content:center;font-size:.66em;color:#A9C0D3}
.plan span{background:rgba(255,255,255,.06);border-radius:999px;padding:.15em .7em}
/* teams editor */
.tedit{display:grid;grid-template-columns:repeat(3,1fr);gap:.6em}
.tedit label{display:flex;align-items:center;gap:.5em;background:rgba(255,255,255,.06);border:2px solid var(--c);border-radius:12px;padding:.45em .6em;font-size:.8em}
.tedit input{flex:1;min-width:0;font:inherit;background:transparent;border:0;color:#fff;font-family:var(--display)}
.tedit .no{width:1.6em;height:1.6em;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-family:var(--display);flex:none}
.cnt{display:flex;gap:.5em;align-items:center;margin:.8em 0;font-size:.8em}
/* buzz / tf / jeop question */
.qlist{display:flex;flex-direction:column;gap:.6em}
.qitem{background:var(--paper);color:var(--ink);border-radius:14px;padding:.6em .9em}
.qitem .q{font-family:var(--display);font-weight:500;font-size:1em;line-height:1.35;display:flex;gap:.6em;align-items:baseline}
.qitem .q i{font-style:normal;color:var(--gold-d);font-weight:700}
.qitem .a{margin-top:.35em;font-size:.88em;color:var(--good);font-weight:700}
.qitem .x{font-size:.75em;color:#37495B;margin-top:.15em;font-weight:400}
.rev{border:0;border-radius:999px;background:#E4E9EE;color:var(--ink);font-family:var(--display);font-size:.75em;padding:.2em .9em;margin-top:.35em}
.award{display:flex;flex-wrap:wrap;gap:.35em;margin-top:.45em;align-items:center;font-size:.72em}
.award>span{color:var(--muted)}
.aw{display:inline-flex;align-items:center;gap:.35em;border:2px solid var(--c);background:#fff;color:var(--ink);border-radius:999px;padding:.15em .7em .15em .3em;font-family:var(--display)}
.aw i{width:1.2em;height:1.2em;border-radius:50%;background:var(--c);color:#fff;font-style:normal;display:grid;place-items:center;font-size:.85em}
.aw.on{background:var(--c);color:#fff}
.aw.on i{background:#fff;color:var(--c)}
.tfbig{background:var(--paper);color:var(--ink);border-radius:18px;padding:1em 1.2em;text-align:center}
.tfbig .num{font-family:var(--display);color:var(--muted);font-size:.75em}
.tfbig .st{font-family:var(--display);font-size:1.45em;line-height:1.35;margin:.2em 0 .5em;font-weight:500}
.tfbig .verdict{font-family:var(--display);font-size:1.6em;font-weight:700}
.tfbig .verdict.t{color:var(--good)}.tfbig .verdict.f{color:var(--bad)}
.tfbig .x{font-size:.85em;color:#37495B}
.tfbig .award{justify-content:center}
.tfnav{display:flex;justify-content:center;gap:.5em;margin-top:.7em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;border:0;border-radius:999px;padding:.4em 1.1em;font-family:var(--display);font-weight:600;font-size:.85em;background:var(--gold);color:#3B2600}
.btn.ghost{background:transparent;border:2px solid #7E97AD;color:#EAF1F6}
.btn.light{background:#E4E9EE;color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
/* match & order */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:.5em 1.2em}
.mrow{display:flex;align-items:center;gap:.6em;background:var(--paper);color:var(--ink);border-radius:12px;padding:.45em .7em;font-family:var(--display);font-size:.95em}
.mrow .n{width:1.5em;height:1.5em;border-radius:50%;background:var(--u1);color:#fff;display:grid;place-items:center;font-size:.8em;flex:none}
.mrow .ans{margin-left:auto;display:flex;align-items:center;gap:.4em;color:var(--good);font-size:.9em}
.mrow .ans img{width:2em;height:1.5em;object-fit:cover;border-radius:3px}
.mrow.hide .ans{visibility:hidden}
.flagrow{display:flex;flex-wrap:wrap;gap:.6em;justify-content:center;margin:.2em 0 .8em}
.flagrow span{display:flex;flex-direction:column;align-items:center;font-size:.7em;color:#C8D7E3;gap:.2em}
.flagrow img{width:3.4em;height:2.55em;object-fit:cover;border-radius:5px;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
.ocards{display:grid;grid-template-columns:repeat(5,1fr);gap:.6em}
.ocard{background:var(--paper);color:var(--ink);border-radius:14px;padding:.6em;min-height:5.5em;display:flex;flex-direction:column;gap:.3em;font-size:.82em;line-height:1.35;position:relative}
.ocard .L{font-family:var(--display);font-weight:700;font-size:1.5em;color:var(--u1);line-height:1}
.ocard .y{position:absolute;right:.5em;top:.4em;font-family:var(--display);font-weight:700;color:var(--good);font-size:1.1em}
.ocard.rv{border:3px solid var(--good)}
.ocard .rank{font-family:var(--display);background:var(--good);color:#fff;border-radius:999px;padding:0 .6em;align-self:flex-start;font-size:.85em}
/* jeopardy */
.jboard{display:grid;grid-template-columns:repeat(4,1fr);gap:.5em}
.jcat{font-family:var(--display);font-weight:600;text-align:center;background:var(--u1);border-radius:12px;padding:.4em;font-size:.85em;display:grid;place-items:center;min-height:2.6em;line-height:1.2}
.jt{border:0;border-radius:14px;background:linear-gradient(180deg,#1E4E7E,#163C63);color:var(--gold);font-family:var(--display);font-weight:700;font-size:1.9em;min-height:2.2em;box-shadow:inset 0 0 0 2px #2F6596}
.jt:hover:not(:disabled){filter:brightness(1.15)}
.jt:disabled{background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 2px rgba(255,255,255,.08);color:transparent;cursor:default;position:relative}
.jt .won{position:absolute;inset:0;display:grid;place-items:center;font-size:.42em;color:#fff}
.jt .won i{width:1.6em;height:1.6em;border-radius:50%;display:grid;place-items:center;font-style:normal;background:var(--c)}
.ov{position:fixed;inset:0;background:rgba(4,14,26,.75);display:grid;place-items:center;padding:16px;z-index:30;font-size:var(--fs)}
.qcard{width:min(1000px,100%);max-height:calc(100dvh - 32px);overflow:auto;background:var(--paper);color:var(--ink);border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.qcard .hd{display:flex;align-items:center;gap:.6em;background:var(--u1);color:#fff;padding:.45em 1em;font-family:var(--display);font-size:.8em}
.qcard .hd b{margin-left:auto;background:var(--gold);color:#3B2600;border-radius:999px;padding:0 .7em}
.qcard .bd{padding:1em 1.3em}
.qcard .qq{font-family:var(--display);font-size:1.4em;line-height:1.4;font-weight:500}
.qcard .vis{margin:.6em 0}
.qcard .vis svg.map{max-height:38vh;width:auto;max-width:100%;margin:auto}
.qcard .ans{background:#E6F4EC;border-radius:12px;padding:.5em .8em;margin-top:.6em;font-family:var(--display);font-size:1.15em;color:#1D5E40}
.qcard .ft{display:flex;flex-wrap:wrap;gap:.4em;padding:0 1.3em 1em;align-items:center}
.qcard .ft .sp{margin-left:auto}
.qcard .btn.ghost{color:var(--ink);border-color:#9AA8B5}
/* exit stage (teacher) */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:.7em}
.step{background:var(--paper);color:var(--ink);border-radius:14px;padding:.7em;font-size:.8em;line-height:1.45}
.step b{display:grid;place-items:center;width:1.8em;height:1.8em;border-radius:50%;background:var(--gold);color:#3B2600;font-family:var(--display);margin-bottom:.3em}
.big1{font-family:var(--display);font-size:1em;margin:.8em 0 .3em;color:#fff}
/* summary */
.lb{display:flex;flex-direction:column;gap:.35em}
.lbr{display:grid;grid-template-columns:2em 1fr auto auto auto;gap:.8em;align-items:center;background:var(--paper);color:var(--ink);border-radius:12px;padding:.35em .8em;font-size:.85em}
.lbr .r{font-family:var(--display);font-weight:700;font-size:1.2em;text-align:center}
.lbr .nm{font-family:var(--display);display:flex;gap:.4em;align-items:center;min-width:0}
.lbr .p{font-family:var(--display);font-weight:700;font-size:1.2em}
.lbr .stars{color:var(--gold-d);letter-spacing:.05em;min-width:3.2em}
.lbr .sc{font-size:.8em;color:var(--muted);text-align:right}
.lbr.r1{box-shadow:inset 0 0 0 3px var(--gold)}
.tools{display:flex;flex-wrap:wrap;gap:.5em;margin-top:.8em}
.verify textarea{width:100%;min-height:7em;font:inherit;font-size:.8em;border-radius:10px;border:2px solid var(--line);background:#0E2741;color:#fff;padding:.5em}
.vtab{width:100%;border-collapse:collapse;font-size:.72em;margin-top:.5em;background:var(--paper);color:var(--ink);border-radius:10px;overflow:hidden}
.vtab th,.vtab td{padding:.3em .5em;border-bottom:1px solid #E5DECB;text-align:left}
.vtab th{background:#EEE6D2;font-family:var(--display)}
.ok{color:var(--good);font-weight:700}.bad{color:var(--bad);font-weight:700}
/* team bar */
.tbar{display:flex;gap:6px;padding:6px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));overflow-x:auto;background:rgba(0,0,0,.22);border-top:1px solid var(--line);scrollbar-width:thin}
.tchip{flex:1 1 0;min-width:150px;display:flex;align-items:center;gap:7px;background:var(--bg2);border:2px solid var(--c);border-radius:14px;padding:4px 6px 4px 8px;min-width:0}
.tchip .fls{display:flex;gap:2px}
.tchip .fls img{width:22px;height:16px;object-fit:cover;border-radius:2px}
.tchip .nm{flex:1;min-width:0;font-family:var(--display);font-size:13px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tchip .pt{font-family:var(--display);font-weight:700;font-size:24px;min-width:1.4em;text-align:center;color:#fff;font-variant-numeric:tabular-nums}
.tchip .pt.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.45);color:var(--gold)}}
.tchip button{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.06);font-family:var(--display);font-size:16px;line-height:1;padding:0}
/* entry + student mode */
.E{min-height:100dvh;display:grid;place-items:center;padding:20px;font-size:17px}
.entry{max-width:720px;width:100%;text-align:center}
.entry h1{font-family:var(--display);font-size:clamp(28px,5vw,44px);margin:.2em 0;line-height:1.15}
.entry h1 b{color:var(--gold)}
.entry p{color:#C8D7E3;line-height:1.6}
.choose{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.choose button{background:var(--bg2);border:2px solid var(--line);border-radius:18px;padding:18px;text-align:left;display:flex;flex-direction:column;gap:6px}
.choose button b{font-family:var(--display);font-size:21px;display:flex;align-items:center;gap:8px;color:#fff}
.choose button span{font-size:14.5px;color:#A9C0D3;line-height:1.5}
.choose button.st{border-color:var(--gold);background:#1B3C5F}
.choose button.st b svg{color:var(--gold)}
.S{max-width:640px;margin:0 auto;padding:14px 16px calc(20px + env(safe-area-inset-bottom,0px));font-size:17px;min-height:100dvh;display:flex;flex-direction:column}
.shd{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.shd .ttl{font-family:var(--display);font-weight:600;line-height:1.2;margin-right:auto}
.shd .ttl small{display:block;font-weight:400;color:#A9C0D3;font-size:13px}
.prog{height:8px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden;margin-bottom:12px}
.prog i{display:block;height:100%;background:var(--gold);transition:width .3s}
.scard{background:var(--paper);color:var(--ink);border-radius:20px;padding:18px;box-shadow:0 14px 40px rgba(0,0,0,.35)}
.scard .qn{font-family:var(--display);color:var(--muted);font-size:14px;display:flex;justify-content:space-between}
.scard .qn .tm{font-weight:700;color:var(--ink);background:#EEF2F5;border-radius:999px;padding:0 10px;font-variant-numeric:tabular-nums}
.scard .qn .tm.low{background:var(--bad);color:#fff}
.scard .qq{font-family:var(--display);font-size:21px;line-height:1.45;margin:8px 0 12px;font-weight:500}
.scard img.qimg{height:110px;display:block;margin:0 auto 12px;border-radius:6px;box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.sopts{display:flex;flex-direction:column;gap:8px}
.sopt{display:flex;align-items:center;gap:10px;text-align:left;border:2px solid #D9D3C4;background:#fff;color:var(--ink);border-radius:14px;padding:11px 12px;font-size:16.5px;line-height:1.4}
.sopt b{width:28px;height:28px;border-radius:50%;background:#EAF1F6;display:grid;place-items:center;flex:none;font-family:var(--display)}
.sopt.ok{border-color:var(--good);background:#E6F4EC}
.sopt.no{border-color:var(--bad);background:#FBE9E5}
.fb{margin-top:12px;border-radius:12px;padding:10px 12px;font-size:15.5px;line-height:1.5}
.fb.ok{background:#E6F4EC;color:#1D5E40}.fb.no{background:#FBE9E5;color:#7A2E22}
.streak{font-family:var(--display);color:var(--gold);font-size:15px;text-align:center;margin-top:8px;min-height:1.4em}
.form{display:flex;flex-direction:column;gap:10px;text-align:left}
.form label{display:flex;flex-direction:column;gap:4px;font-size:14.5px;color:#C8D7E3}
.form input{font:inherit;font-size:17px;padding:11px 12px;border-radius:12px;border:2px solid var(--line);background:#0E2741;color:#fff}
.form .two{grid-template-columns:1fr 1fr;gap:10px}
.visa{position:relative;text-align:center;padding:10px 4px}
.stamp{width:150px;height:150px;margin:6px auto 4px;border-radius:50%;border:6px double var(--c);color:var(--c);display:grid;place-items:center;transform:rotate(-8deg);font-family:var(--display);font-weight:700;line-height:1.1;animation:stamp .5s ease-out}
.stamp small{display:block;font-size:12px;font-weight:500}
.stamp b{font-size:30px}

.rline{background:#EEF2F5;border-radius:12px;padding:10px 12px;font-family:var(--display);font-size:15px;word-break:break-word;margin:10px 0;text-align:left;color:var(--ink)}

/* ---- extra game formats ---- */

.turnchip{display:inline-flex;align-items:center;gap:.4em;background:var(--c);color:#fff;border-radius:999px;padding:.2em .9em .2em .3em;font-family:var(--display);font-size:.85em}

.abc{background:var(--paper);color:var(--ink);border-radius:20px;padding:1em;text-align:center;display:flex;flex-direction:column;gap:.4em;justify-content:center;position:relative;transition:transform .3s,opacity .3s}
.abL{position:absolute;left:.5em;top:.4em;font-family:var(--display);font-weight:700;font-size:1.8em;color:var(--u1)}
.abf{display:flex;gap:.3em;justify-content:center}
.abf img{width:3.2em;height:2.4em;object-fit:cover;border-radius:4px;box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.abt{font-family:var(--display);font-size:1.25em;line-height:1.35}
.aby{font-family:var(--display);font-weight:700;font-size:1.6em;color:var(--good)}
.abc.win{box-shadow:0 0 0 5px var(--good);transform:scale(1.03)}
.abc.lose{opacity:.6}
.abc.lose .aby{color:var(--muted)}
.vs{align-self:center;font-family:var(--display);font-weight:700;font-size:1.6em;color:var(--gold)}
.wheelbox{position:relative;max-width:min(52vh,100%);margin:0 auto}
.wheel{pointer-events:none;width:100%;height:auto;display:block;transition:transform 2.2s cubic-bezier(.15,.85,.25,1)}
.pin{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:26px solid var(--gold);z-index:2;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.wc{display:flex;align-items:center;gap:.7em;margin-bottom:.5em}
.wc img{width:4em;height:3em;object-fit:cover;border-radius:6px;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
.wc b{font-family:var(--display);font-size:1.6em;display:block;line-height:1.1}
.wc small{color:#A9C0D3;font-size:.7em}
.lv{display:flex;gap:.5em;margin-bottom:.6em}
.lvb{flex:1;border:2px solid var(--gold);background:transparent;color:var(--gold);border-radius:12px;padding:.35em;font-family:var(--display);font-weight:700;font-size:1em}
.lvb.on{background:var(--gold);color:#3B2600}
.lvb:disabled:not(.on){opacity:.3}
.hearts{display:flex;flex-wrap:wrap;gap:.4em;margin-bottom:.6em;font-size:.8em}
.hrow{display:inline-flex;align-items:center;gap:.35em;border:2px solid var(--c);border-radius:999px;padding:.1em .7em .1em .25em;color:#FF8A8A;letter-spacing:.05em}
.hrow i{font-style:normal;width:1.4em;height:1.4em;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;letter-spacing:0}
.hrow.out{opacity:.35;text-decoration:line-through}
.svo{display:grid;grid-template-columns:1fr 1fr;gap:.45em;text-align:left;margin-top:.3em}
.svopt{display:flex;gap:.5em;align-items:center;border:2px solid #D9D3C4;border-radius:12px;padding:.35em .7em;font-size:.9em;background:#fff}
.svopt b{width:1.5em;height:1.5em;border-radius:50%;background:#EAF1F6;display:grid;place-items:center;font-family:var(--display);flex:none}
.svopt.ok{border-color:var(--good);background:#E6F4EC}
.clues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.45em}
.clues li{display:flex;gap:.6em;align-items:center;background:rgba(255,255,255,.06);border:2px dashed #3E6A93;border-radius:12px;padding:.45em .8em;color:#6F8DA8;font-family:var(--display)}
.clues li b{width:1.5em;height:1.5em;border-radius:50%;background:#2A5480;color:#fff;display:grid;place-items:center;flex:none;font-size:.85em}
.clues li.on{background:var(--paper);color:var(--ink);border:2px solid var(--paper);animation:pop .3s}
.clues li.on b{background:var(--gold);color:#3B2600}
@keyframes pop{from{transform:scale(.95);opacity:.3}}
.prop{background:var(--paper);color:var(--ink);border-radius:16px;padding:.7em 1em;font-family:var(--display);font-size:1.25em;line-height:1.4;margin-bottom:.6em}
.prop small{display:block;font-size:.55em;color:var(--muted)}
.votes{display:grid;grid-template-columns:repeat(auto-fit,minmax(9em,1fr));gap:.45em}
.vbtn{border:2px solid var(--c);background:var(--bg2);border-radius:14px;padding:.4em .5em;display:flex;flex-direction:column;align-items:center;gap:.2em;font-size:.78em}
.vbtn .fls{display:flex;gap:2px}.vbtn .fls img{width:1.8em;height:1.3em;object-fit:cover;border-radius:2px}
.vbtn b{font-family:var(--display)}
.vbtn .vl{border-radius:999px;padding:0 .7em;background:rgba(255,255,255,.1)}
.vbtn.v1 .vl{background:var(--good)}.vbtn.v2 .vl{background:var(--bad)}.vbtn.v3 .vl{background:#6F7F8F}
.tally{display:flex;gap:1.2em;justify-content:center;margin:.5em 0;font-size:.85em;color:#C8D7E3}
.tally b{font-family:var(--display);font-size:1.3em;color:#fff}
.vres{display:grid;grid-template-columns:1fr 1fr;gap:.6em}
.vres div{border-radius:14px;padding:.4em;text-align:center;font-family:var(--display);font-size:1.4em;font-weight:700}
.vres small{display:block;font-size:.5em;font-weight:400}
.vres .p{background:#E6F4EC;color:#1D5E40}.vres .f{background:#FBE9E5;color:#7A2E22}
.oddg{display:grid;grid-template-columns:1fr 1fr;gap:.6em}
.oddc{background:var(--paper);color:var(--ink);border-radius:16px;padding:.7em .9em;font-family:var(--display);font-size:1.15em;display:flex;gap:.6em;align-items:center;transition:opacity .3s}
.oddc b{width:1.6em;height:1.6em;border-radius:50%;background:var(--u1);color:#fff;display:grid;place-items:center;flex:none;font-size:.8em}
.oddc.odd{box-shadow:0 0 0 5px var(--bad)}.oddc.odd b{background:var(--bad)}
.oddc.dim{opacity:.5}
.memwrap{display:grid;grid-template-columns:1fr 13em;gap:1em;align-items:start}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:.45em}
.mc{border:0;border-radius:12px;min-height:3.6em;background:linear-gradient(160deg,#2F6596,#1A4068);color:var(--gold);font-family:var(--display);font-weight:700;font-size:1.3em;padding:.3em;box-shadow:inset 0 0 0 2px #3E78AC}
.mc.up{background:var(--paper);color:var(--ink);font-size:.72em;font-weight:500;box-shadow:inset 0 0 0 3px var(--gold);animation:pop .3s}
.mc.got{background:var(--c);color:#fff;font-size:.68em;font-weight:500;box-shadow:none;opacity:.92}
.mc.up.n span,.mc.got.n span{font-weight:700}
.mc:disabled{cursor:default}
.memside{display:flex;flex-direction:column;gap:.5em;align-items:flex-start}
.qlm{display:flex;justify-content:center;margin-bottom:10px}
.qlm svg{height:130px;width:auto;background:#EAF3F7;border-radius:12px}
.seqpick{display:flex;flex-direction:column;gap:4px;min-height:44px;background:#F3EFE4;border-radius:12px;padding:8px 10px;margin-bottom:10px;font-size:15px;color:var(--ink)}
.seqpick span{color:var(--muted)}
.seqpick i{font-style:normal}
.seqpick i.ok{color:var(--good)}.seqpick i.no{color:var(--bad)}
.ctry{display:grid;grid-template-columns:repeat(auto-fill,minmax(7.4em,1fr));gap:.45em}
.ct{background:var(--paper);color:var(--ink);border-radius:12px;padding:.4em;text-align:center;font-size:.66em;line-height:1.3}
.ct .hd{display:flex;align-items:center;gap:.35em;justify-content:center;font-family:var(--display);font-size:1.15em}
.ct .hd img{width:1.8em;height:1.35em;object-fit:cover;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.ct svg.lm{width:100%;height:auto;max-height:5.5em;display:block;background:#EAF3F7;border-radius:8px;margin:.2em 0}
.org{display:flex;flex-direction:column;gap:.35em;align-items:center}
.org .lvl{display:flex;gap:.4em;flex-wrap:wrap;justify-content:center;width:100%}
.org .box{background:var(--paper);color:var(--ink);border-radius:12px;padding:.35em .7em;font-family:var(--display);font-size:.8em;text-align:center;border-top:5px solid var(--bc,#1F5FAE);flex:1 1 0;min-width:8em}
.org .box small{display:block;font-family:var(--body);color:var(--muted);font-size:.85em}
.org .ar{color:var(--gold);font-size:.9em;line-height:1}

/* ---- class setup, grouping, number picker ---- */
.setrow{display:flex;flex-wrap:wrap;gap:.6em;align-items:flex-end;margin:0 0 .7em;font-size:.8em}
.setrow label{display:flex;flex-direction:column;gap:.2em;color:#A9C0D3;font-size:.9em}
.setrow label.wide{flex:1;min-width:12em}
.setrow input{font:inherit;font-size:1.05em;padding:.35em .6em;border-radius:10px;border:2px solid var(--line);background:#0E2741;color:#fff;width:7em}
.setrow label.wide input{width:100%}
.setrow>span{align-self:center;color:#C8D7E3}
.pres{align-self:center;color:#C8D7E3}.pres b{color:var(--gold);font-family:var(--display);font-size:1.3em}
.modesw{display:grid;grid-template-columns:1fr 1fr;gap:.6em;margin-bottom:.8em}
.msw{border:2px solid var(--line);background:var(--bg2);border-radius:16px;padding:.6em .9em;text-align:left;display:grid;grid-template-columns:auto 1fr;gap:0 .6em;align-items:center;font-size:.85em}
.msw svg{grid-row:span 2;width:1.8em;height:1.8em;color:#7E97AD}
.msw b{font-family:var(--display);font-size:1.2em;color:#fff}
.msw small{color:#A9C0D3}
.msw.on{border-color:var(--gold);background:#1B3C5F}.msw.on svg{color:var(--gold)}
.chip2{border:1.5px solid #4D6F8F;background:transparent;border-radius:999px;padding:.3em .9em;color:#DCE7F0}
.chip2.on{background:#EAF1F6;color:var(--ink);border-color:#EAF1F6;font-weight:600}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(12em,1fr));gap:.5em}
.gcard{background:var(--bg2);border:2px solid var(--c);border-radius:14px;padding:.45em .55em;font-size:.78em}
.gh{display:flex;align-items:center;gap:.35em;margin-bottom:.35em}
.gh .no{width:1.6em;height:1.6em;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-family:var(--display);flex:none}
.gh input{flex:1;min-width:0;font:inherit;font-family:var(--display);background:transparent;border:0;color:#fff}
.gm{display:flex;flex-wrap:wrap;gap:.25em}
.gm i{font-style:normal;font-family:var(--display);background:var(--paper);color:var(--ink);border-radius:8px;min-width:2em;text-align:center;padding:0 .3em;font-variant-numeric:tabular-nums}
.gm span{color:#7E97AD}
.pbar{display:flex;align-items:center;gap:12px;width:100%;flex-wrap:wrap}
.pbar .btn{font-size:16px}
.plast{font-family:var(--display);font-size:18px}.plast b{color:var(--gold);font-size:26px}
.phist{display:flex;gap:4px;flex-wrap:wrap}
.phist i{font-style:normal;font-family:var(--display);background:rgba(255,255,255,.08);border-radius:6px;padding:0 6px;font-size:13px;color:#C8D7E3}
.pleft{margin-left:auto;font-size:13px;color:#A9C0D3}
.pickc{max-width:420px;text-align:center}
.pickc small{color:var(--muted);font-size:.65em}
.bigno{font-family:var(--display);font-weight:700;font-size:5em;line-height:1.1;color:var(--u1);font-variant-numeric:tabular-nums}

.pickc .pg span{display:inline-block;background:var(--c);color:#fff;border-radius:999px;padding:.1em .9em;font-family:var(--display);font-size:.9em}
.cnts{display:grid;grid-template-columns:repeat(3,1fr);gap:.6em;margin-bottom:.6em}
.cntb{background:var(--paper);color:var(--ink);border-radius:14px;padding:.5em;text-align:center;font-size:.85em;border-top:6px solid #6F7F8F}

.cntb div{display:flex;align-items:center;justify-content:center;gap:.6em}
.cntb span{font-family:var(--display);font-weight:700;font-size:2em;min-width:1.5em}
@media (max-width:600px){.modesw{grid-template-columns:1fr}.cnts{grid-template-columns:1fr}.pleft{margin-left:0}}

/* ---- P4 formats ---- */
.sortw{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:1em;align-items:start}
.sortq{background:var(--paper);color:var(--ink);border-radius:18px;padding:1em;text-align:center;display:flex;flex-direction:column;gap:.5em;align-items:center}
.sortq small{color:var(--muted);font-family:var(--display)}
.sortq>b{font-family:var(--display);font-size:1.45em;line-height:1.35;font-weight:500}
.tag{border-radius:999px;padding:.15em .9em;font-family:var(--display);color:#fff;background:var(--u1)}
.tag.t0{background:#1F5FAE}.tag.t1{background:#C9503A}
.buckets{display:grid;grid-template-columns:1fr 1fr;gap:.6em}
.bucket{border:3px dashed #3E6A93;border-radius:16px;padding:.5em;min-height:12em;display:flex;flex-direction:column;gap:.35em}
.bucket .bh{font-family:var(--display);font-weight:600;text-align:center;border-radius:10px;padding:.2em;color:#fff}
.bucket.b0 .bh{background:#1F5FAE}.bucket.b1 .bh{background:#C9503A}
.bucket span{background:var(--paper);color:var(--ink);border-radius:10px;padding:.25em .6em;font-size:.75em;animation:pop .35s}
.lies{display:flex;flex-direction:column;gap:.6em}
.liec{display:flex;align-items:center;gap:.8em;background:var(--paper);color:var(--ink);border-radius:16px;padding:.6em .9em;font-family:var(--display);font-size:1.15em;transition:opacity .3s}
.liec b{width:1.7em;height:1.7em;border-radius:50%;background:var(--u1);color:#fff;display:grid;place-items:center;flex:none}
.liec em{margin-left:auto;font-style:normal;font-weight:700;border-radius:999px;padding:0 .8em;color:#fff;background:var(--good)}
.liec.lie{box-shadow:0 0 0 5px var(--bad)}.liec.lie em{background:var(--bad)}
.liec.truth{opacity:.65}
.msn{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:1em;align-items:start}
.crisis{background:var(--paper);color:var(--ink);border-radius:18px;overflow:hidden}
.crisis .ch{display:flex;align-items:center;gap:.8em;background:#7A2E22;color:#fff;padding:.4em .9em;font-family:var(--display);font-size:.8em}
.fuse{flex:1;height:.55em;border-radius:999px;background:rgba(255,255,255,.2);overflow:hidden}
.fuse i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#F2B630,#FF6B3D);transform-origin:left}
.fuse i.run{animation:fuse linear forwards}
@keyframes fuse{to{transform:scaleX(0)}}
.ct2{font-family:var(--display);font-size:1.25em;line-height:1.45;padding:.7em .9em 0}
.crisis .x,.crisis .award,.crisis .tfnav{padding:0 .9em .7em}
.tools2{display:grid;grid-template-columns:1fr 1fr;gap:.45em}
.tool{display:flex;gap:.5em;align-items:center;background:var(--bg2);border:2px solid var(--line);border-radius:12px;padding:.4em .6em;font-family:var(--display);font-size:.85em;line-height:1.25;transition:opacity .3s}
.tool b{width:1.6em;height:1.6em;border-radius:50%;background:var(--gold);color:#3B2600;display:grid;place-items:center;flex:none}
.tool small{display:block;font-family:var(--body);color:#A9C0D3;font-size:.82em}
.tool.ok{border-color:var(--good);background:#1F4D3A}.tool.dim{opacity:.4}
.bingo{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:1em;align-items:start}
.bank{display:flex;flex-wrap:wrap;gap:.35em}

.bgrid{display:grid;grid-template-columns:repeat(3,3em);grid-template-rows:repeat(3,2.2em);gap:3px;margin-top:.7em}
.bgrid i{border:2px dashed #4D6F8F;border-radius:6px}
.bclue{background:var(--paper);color:var(--ink);border-radius:18px;padding:1em;text-align:center;min-height:7em;display:flex;flex-direction:column;gap:.4em;align-items:center;justify-content:center}
.bclue small{color:var(--muted);font-family:var(--display)}
.bclue b{font-family:var(--display);font-size:1.35em;line-height:1.4;font-weight:500}
.catl{display:flex;flex-direction:column;gap:8px}
.catr{background:#fff;border:1.5px solid #E2DACB;border-radius:12px;padding:8px 10px;font-size:15.5px}
.catr>div{display:flex;gap:6px;margin-top:6px}
.catb{flex:1;border:2px solid #CFC7B6;background:#F7F4EC;border-radius:10px;padding:6px;font-size:14px;color:var(--ink)}
.catb.on{border-color:var(--u1);background:#E3EDF8;font-weight:700}
.catb.ok{border-color:var(--good);background:#E6F4EC}.catb.no{border-color:var(--bad);background:#FBE9E5}

/* ---- P5+ formats ---- */
.calcw{display:flex;justify-content:center}

.pr.q em{color:var(--gold-d)}.pr.sum em{color:var(--good);font-size:1.3em}

.rope .side.l{border:2px solid #1F5FAE}.rope .side.r{border:2px solid #C9503A}
.track{position:relative;height:3em;border-radius:999px;background:linear-gradient(90deg,rgba(31,95,174,.35),rgba(255,255,255,.05) 50%,rgba(201,80,58,.35))}
.track i{position:absolute;top:50%;width:2px;height:40%;transform:translate(-50%,-50%);background:rgba(255,255,255,.25)}
.track .mid{position:absolute;left:50%;top:0;bottom:0;width:3px;background:var(--gold);transform:translateX(-50%)}
.track .flag{position:absolute;top:50%;transform:translate(-50%,-50%);width:2.2em;height:2.2em;border-radius:50%;background:var(--gold);color:#3B2600;display:grid;place-items:center;transition:left .5s cubic-bezier(.2,.8,.2,1)}
.corn{display:grid;grid-template-columns:repeat(4,1fr);gap:.5em}
.cn{background:var(--paper);color:var(--ink);border-radius:14px;padding:.5em;text-align:center;border-top:6px solid var(--c);display:flex;flex-direction:column;gap:.2em;font-size:.82em}
.cn b{font-family:var(--display);color:var(--c)}
.cn .bar{height:4em;background:#EEF2F5;border-radius:8px;display:flex;align-items:flex-end;overflow:hidden}
.cn .bar i{display:block;width:100%;background:var(--c);transition:height .3s}
.cn .cc{display:flex;justify-content:center;align-items:center;gap:.4em}.cn .cc em{font-style:normal;font-family:var(--display);font-weight:700;font-size:1.4em;min-width:1.5em}
.cn .cc .btn{padding:.1em .7em}
.bids{display:grid;grid-template-columns:repeat(auto-fit,minmax(11em,1fr));gap:.45em}
.bid{background:var(--bg2);border:2px solid var(--c);border-radius:14px;padding:.4em .5em;font-size:.78em;position:relative}
.bid .bt{display:flex;align-items:center;gap:.35em;font-family:var(--display)}
.bid .bt i{font-style:normal;width:1.4em;height:1.4em;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:.85em}
.bid .coins{margin-left:auto;color:var(--gold)}
.bid .bb{display:flex;gap:.25em;margin-top:.3em;flex-wrap:wrap}
.bid .bb button{border:1px solid var(--line);background:transparent;border-radius:8px;padding:.1em .55em;min-width:2em}
.bid .bb button.on{background:var(--gold);color:#3B2600;border-color:var(--gold)}
.bid .bb .tfb.on{background:#EAF1F6;color:var(--ink)}
.bid .res{position:absolute;right:.4em;bottom:.3em;font-family:var(--display);font-weight:700;font-size:1.3em}
.bid .res.w{color:#7BD3A0}.bid .res.l{color:#FF9A86}
.hot{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:1em;align-items:start}
.hs{background:var(--paper);color:var(--ink);border-radius:18px;padding:.8em;text-align:center;display:flex;flex-direction:column;gap:.4em;align-items:center}
.seat{display:flex;flex-direction:column;align-items:center;gap:.2em;font-family:var(--display)}.seat svg{width:2em;height:2em;color:var(--bad)}
.htime b{font-family:var(--display);font-size:3.2em;line-height:1;font-variant-numeric:tabular-nums}.htime small{display:block;color:var(--muted)}
.hsc{display:flex;gap:.6em;font-family:var(--display)}.hsc .ok{color:var(--good)}.hsc .no{color:var(--bad)}
.hq{background:var(--paper);color:var(--ink);border-radius:18px;padding:1em;min-height:10em}
.hq .qq{font-family:var(--display);font-size:1.45em;line-height:1.4}
.hq .a{color:var(--good);font-family:var(--display);font-size:1.1em;margin-top:.3em}
.hres{display:flex;flex-wrap:wrap;gap:.4em;margin-top:.6em;font-size:.75em;color:var(--muted)}.hres span{background:#EEF2F5;border-radius:999px;padding:0 .7em}
.rtabs{display:flex;flex-wrap:wrap;gap:.35em;margin-bottom:.6em}
.rtabs button{border:1.5px solid #4D6F8F;background:transparent;border-radius:999px;padding:.2em .8em;font-size:.8em}
.rtabs button.on{background:var(--gold);color:#3B2600;border-color:var(--gold)}
.rub{display:flex;flex-direction:column;gap:.4em}
.rc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.8em;align-items:center;background:var(--paper);color:var(--ink);border-radius:12px;padding:.45em .8em}
.rc b{font-family:var(--display);display:block}.rc small{color:var(--muted);font-size:.78em}
.rs{display:flex;gap:.25em}.rs button{border:1.5px solid #CFC7B6;background:#F7F4EC;color:var(--ink);border-radius:8px;min-width:2.2em;padding:.15em .3em;font-family:var(--display)}
.rs button.on{background:var(--u1);color:#fff;border-color:var(--u1)}
.tl11{list-style:none;margin:0;padding:0 0 0 .9em;border-left:4px solid var(--gold);display:flex;flex-direction:column;gap:.35em}
.tl11 li{background:var(--paper);color:var(--ink);border-radius:10px;padding:.3em .7em;font-size:.8em;position:relative}
.tl11 li::before{content:"";position:absolute;left:-1.35em;top:.75em;width:.8em;height:.8em;border-radius:50%;background:var(--gold)}
.tl11 b{font-family:var(--display);color:var(--good);margin-right:.5em}
@media (max-width:900px){.corn{grid-template-columns:1fr 1fr}.hot{grid-template-columns:1fr}.rope{grid-template-columns:1fr}.rc{grid-template-columns:1fr}}

@media (max-width:900px){

  .ocards{grid-template-columns:1fr 1fr}

  .tedit{grid-template-columns:1fr 1fr}

/* ตัวจับเวลาข้อ: เริ่ม/หยุด/เดินต่อ/เพิ่มเวลาได้ หมดเวลาแล้วแค่แจ้ง ไม่เฉลยเอง ครูกดเฉลยเอง */
const QT={left:0,tot:0,run:false,int:null,
  el(){let p=$('qt');if(!p){p=document.createElement('div');p.id='qt';p.className='qt';p.setAttribute('role','timer');document.body.appendChild(p)}return p},
  open(){const p=this.el();p.hidden=false;this.paint()},
  close(){clearInterval(this.int);this.run=false;const p=$('qt');if(p)p.hidden=true},
  start(sec){this.tot=sec;this.left=sec;this.run=true;this.open();this.loop()},
  loop(){clearInterval(this.int);this.int=setInterval(()=>{if(!this.run)return;this.left--;if(this.left<=0){this.left=0;this.run=false;clearInterval(this.int);return this.paint()}this.num()},1000);this.paint()},
  num(){const p=$('qt'),n=p&&p.querySelector('.qtn');if(!n)return this.paint();const s=Math.max(0,this.left);n.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
    p.classList.toggle('low',this.run&&s<=5&&s>0);const f=$('fuse');if(f&&this.tot)f.style.transform=`scaleX(${s/this.tot})`},
  paint(){const p=$('qt');if(!p)return;const s=Math.max(0,this.left),up=this.tot>0&&s===0;
    const f=$('fuse');if(f){f.style.transform=this.tot?`scaleX(${s/this.tot})`:'';}
    p.classList.toggle('up',up);p.classList.toggle('low',this.run&&s<=5&&s>0);
    p.innerHTML=`<div class="qtt"><span>${ic('clock')}จับเวลาข้อ</span><button type="button" data-q="x" aria-label="ปิดตัวจับเวลา">✕</button></div>
     <div class="qtn">${up?'หมดเวลา':this.tot?Math.floor(s/60)+':'+String(s%60).padStart(2,'0'):'—'}</div>
     ${up?'<div class="qth">ครูกด "เฉลย" ในเกมเมื่อพร้อม</div>':''}
     <div class="qtb">${this.tot&&!up?`<button type="button" data-q="p" class="main">${this.run?'⏸ หยุด':'▶ เดินต่อ'}</button><button type="button" data-q="+">+10</button>`:''}${[15,30,60,90].map(n=>`<button type="button" data-q="${n}">${n}″</button>`).join('')}</div>`;
    p.querySelectorAll('button').forEach(b=>b.onclick=()=>{const q=b.dataset.q;if(q==='x')return this.close();if(q==='p'){this.run=!this.run;return this.paint()}
      if(q==='+'){this.left+=10;this.tot=Math.max(this.tot,this.left);return this.paint()}this.start(+q)})}
};

survivor:{html(s,i){if(SOLO()){const st=X(i+'s',{k:0,rv:{}});const q=s.qs[st.k],rv=st.rv[st.k];
  return head(s)+`<p class="rule">โหมดรายบุคคล: ทุกคนยืนขึ้น ชูนิ้ว 1–4 ตามตัวเลือก (ก=1 ข=2 ค=3 ง=4) ตอบผิดนั่งลง คนที่ยืนอยู่ถึงข้อสุดท้ายคือผู้รอด</p><div class="tfbig"><div class="num">ข้อ ${st.k+1} / ${s.qs.length}</div><div class="st" style="font-size:1.2em">${esc(q[0])}</div>
   <div class="svo">${q[1].map((o,n)=>`<div class="svopt ${rv&&n===q[2]?'ok':''}"><b>${LET[n]}</b>${esc(o)}</div>`).join('')}</div>${rv?`<div class="x" style="margin-top:.4em">${esc(q[3])}</div>`:`<button class="btn" type="button" id="svRv" style="margin-top:.5em">เฉลย</button>`}</div>${pager(st.k,s.qs.length,'sv')}${noteH(s)}`}
  const st=X(i,{k:0,hearts:S.teams.map(()=>s.lives),wrong:{},done:{},rv:{}});while(st.hearts.length<S.teams.length)st.hearts.push(s.lives);
  const q=s.qs[st.k],rv=st.rv[st.k],dn=st.done[st.k],wr=st.wrong[st.k]||{};const alive=st.hearts.map((h,t)=>h>0?t:-1).filter(t=>t>=0&&t<S.teams.length);
  return head(s)+`<p class="rule">${esc(s.rule)}</p><div class="hearts">${S.teams.map((t,k)=>`<span class="hrow ${st.hearts[k]>0?'':'out'}" style="--c:${TCOL[k]}"><i>${k+1}</i>${'♥'.repeat(Math.max(0,st.hearts[k]))}${'♡'.repeat(Math.max(0,s.lives-st.hearts[k]))}</span>`).join('')}</div>
   <div class="tfbig"><div class="num">ข้อ ${st.k+1} / ${s.qs.length} · ทีมที่ยังรอด ${alive.length} ทีม</div><div class="st" style="font-size:1.2em">${esc(q[0])}</div>
   <div class="svo">${q[1].map((o,n)=>`<div class="svopt ${rv&&n===q[2]?'ok':''}"><b>${LET[n]}</b>${esc(o)}</div>`).join('')}</div>
   ${rv?`<div class="x" style="margin-top:.4em">${esc(q[3])}</div>`+(dn?`<div class="rule" style="margin:.5em 0 0;color:var(--ink);background:#EEF2F5">บันทึกผลข้อนี้แล้ว</div>`:`<div class="award"><span>กดเลือกทีมที่ตอบผิด แล้วกดยืนยัน:</span>${S.teams.map((t,k)=>st.hearts[k]>0?`<button type="button" class="aw ${wr[k]?'on':''}" style="--c:${TCOL[k]}" data-wr="${k}"><i>${k+1}</i>${esc(t.n.replace(/^ทีม/,''))}</button>`:'').join('')}<button class="btn" type="button" id="svOk">ยืนยัน (ทีมที่ถูก +1)</button></div>`)
     :`<button class="btn" type="button" id="svRv" style="margin-top:.5em">เฉลย</button>`}</div>
   ${pager(st.k,s.qs.length,'sv')}${st.k===s.qs.length-1&&dn?`<div style="margin-top:.6em">${awardRow(i+'-svbonus',3,'โบนัสทีมที่รอดถึงข้อสุดท้าย')}</div>`:''}${noteH(s)}`},
 bind(s,i){const st=S.x[SOLO()?i+'s':i];bindPager(st,s.qs.length);
  if($('svRv'))$('svRv').onclick=()=>{st.rv[st.k]=1;save();rerender()};
  document.querySelectorAll('[data-wr]').forEach(b=>b.onclick=()=>{const w=st.wrong[st.k]=st.wrong[st.k]||{};w[+b.dataset.wr]=!w[+b.dataset.wr];save();rerender()});
  if($('svOk'))$('svOk').onclick=()=>{const w=st.wrong[st.k]||{};S.teams.forEach((t,k)=>{if(st.hearts[k]<=0)return;if(w[k])st.hearts[k]--;else addPts(k,1)});st.done[st.k]=1;save();rerender()}}},

/* 5 คำใบ้: clues appear one by one; fewer clues = more points */
clues:{html(s,i){const st=X(i,{k:0,shown:{},rv:{}});const r=s.rounds[st.k],n=st.shown[st.k]||1,val=6-n,rv=st.rv[st.k];
  return head(s)+`<p class="rule">${esc(s.rule)}</p><div class="two" style="align-items:start"><ol class="clues">${r.clues.map((c,k)=>`<li class="${k<n||rv?'on':''}"><b>${k+1}</b>${k<n||rv?esc(c):'คำใบ้ที่ '+(k+1)}</li>`).join('')}</ol>
   <div><div class="valbig"><small>ใช้คำใบ้ ${n} / 5 · ตอบถูกตอนนี้ได้</small><b>${rv?'':val}</b><small>${rv?'':'แต้ม'}</small></div>
   ${rv?`<div class="qitem"><div class="a" style="font-size:1.3em;margin:0">${esc(r.a)}</div>${awardRow(i+'-c'+st.k,val)}</div>`:`<div class="tfnav" style="justify-content:flex-start"><button class="btn" type="button" id="cMore" ${n>=5?'disabled':''}>เปิดคำใบ้ถัดไป</button><button class="btn ghost" type="button" id="cRv">เฉลย</button></div>`}
   ${pager(st.k,s.rounds.length,'cl')}</div></div>${noteH(s)}`},
 bind(s,i){const st=S.x[i];bindPager(st,s.rounds.length);if($('cMore'))$('cMore').onclick=()=>{st.shown[st.k]=(st.shown[st.k]||1)+1;save();rerender()};if($('cRv'))$('cRv').onclick=()=>{st.rv[st.k]=1;save();rerender()}}},

/* จำลองประชุม: each team votes as its country; compare majority vote with consensus */
vote:{html(s,i){if(SOLO()){const st=X(i+'s',{k:0,c:{}});const c=st.c[st.k]||[0,0,0],[yes,no,abs]=c;
  return head(s)+`<p class="rule">โหมดรายบุคคล: นักเรียนทุกคนเป็นผู้แทน ยกมือลงมติ ครูกด + / − ตามจำนวนมือ</p><div class="prop"><small>ข้อเสนอที่ ${st.k+1}</small>${esc(s.props[st.k])}</div>
   <div class="cnts">${['เห็นด้วย','ไม่เห็นด้วย','งดออกเสียง'].map((l,k)=>`<div class="cntb c${k}"><b>${l}</b><div><button type="button" class="btn light" data-cv="${k}" data-d="-1">−</button><span>${c[k]}</span><button type="button" class="btn light" data-cv="${k}" data-d="1">+</button></div></div>`).join('')}</div>
   ${yes+no+abs?`<div class="vres"><div class="${yes>no?'p':'f'}"><small>ถ้าใช้เสียงข้างมาก</small>${yes>no?'ผ่าน':'ไม่ผ่าน'}</div><div class="${no===0&&yes>0?'p':'f'}"><small>ถ้าใช้ฉันทามติแบบอาเซียน</small>${no===0&&yes>0?'ผ่าน':'ไม่ผ่าน'}</div></div><div class="ask">${esc(s.ask)}</div>`:''}${pager(st.k,s.props.length,'vt')}${noteH(s)}`}
  const st=X(i,{k:0,v:{}});const vv=st.v[st.k]||{},lab=['ยังไม่ลงมติ','เห็นด้วย','ไม่เห็นด้วย','งดออกเสียง'];
  const yes=S.teams.filter((_,k)=>vv[k]===1).length,no=S.teams.filter((_,k)=>vv[k]===2).length,abs=S.teams.filter((_,k)=>vv[k]===3).length,all=S.teams.every((_,k)=>vv[k]);
  return head(s)+`<p class="rule">${esc(s.rule)}</p><div class="prop"><small>ข้อเสนอที่ ${st.k+1}</small>${esc(s.props[st.k])}</div>
   <div class="votes">${S.teams.map((t,k)=>`<button type="button" class="vbtn v${vv[k]||0}" data-vt="${k}" style="--c:${TCOL[k]}"><span class="fls">${t.f.map(c=>`<img src="${FLAG[c]}" alt="">`).join('')}</span><b>${esc(t.n.replace(/^ทีม/,''))}</b><span class="vl">${lab[vv[k]||0]}</span></button>`).join('')}</div>
   <div class="tally"><span>เห็นด้วย <b>${yes}</b></span><span>ไม่เห็นด้วย <b>${no}</b></span><span>งดออกเสียง <b>${abs}</b></span></div>
   ${all?`<div class="vres"><div class="${yes>no?'p':'f'}"><small>ถ้าใช้เสียงข้างมาก</small>${yes>no?'ผ่าน':'ไม่ผ่าน'}</div><div class="${no===0&&yes>0?'p':'f'}"><small>ถ้าใช้ฉันทามติแบบอาเซียน</small>${no===0&&yes>0?'ผ่าน':'ไม่ผ่าน'}</div></div>
     <div class="ask">${esc(s.ask)}</div>${awardRow(i+'-v'+st.k,1,'ทีมที่ให้เหตุผลสนับสนุนจุดยืนได้ชัด')}`:`<p class="note">กดที่ทีมเพื่อเปลี่ยนมติ (เห็นด้วย → ไม่เห็นด้วย → งดออกเสียง) เมื่อลงมติครบทุกทีม ผลจะปรากฏ</p>`}
   ${pager(st.k,s.props.length,'vt')}${noteH(s)}`},
 bind(s,i){if(SOLO()){const st=S.x[i+'s'];bindPager(st,s.props.length);document.querySelectorAll('[data-cv]').forEach(b=>b.onclick=()=>{const c=st.c[st.k]=st.c[st.k]||[0,0,0];const k=+b.dataset.cv;c[k]=Math.max(0,c[k]+ +b.dataset.d);save();rerender()});return}
  const st=S.x[i];bindPager(st,s.props.length);document.querySelectorAll('[data-vt]').forEach(b=>b.onclick=()=>{const v=st.v[st.k]=st.v[st.k]||{};const k=+b.dataset.vt;v[k]=((v[k]||0)%3)+1;save();rerender()})}},

/* ตัวไหนไม่เข้าพวก */
odd:{html(s,i){const st=X(i,{k:0,rv:{}});const [items,odd,x]=s.sets[st.k],rv=st.rv[st.k];
  return head(s)+`<p class="rule">${esc(s.rule)}</p><div class="oddg">${items.map((t,n)=>`<div class="oddc ${rv?(n===odd?'odd':'dim'):''}"><b>${LET[n]}</b>${esc(t)}</div>`).join('')}</div>
   <div style="margin-top:.6em">${rv?`<div class="rule" style="border-color:var(--good)">ไม่เข้าพวกคือ ${LET[odd]} · ${esc(x)}</div>${awardRow(i+'-o'+st.k,1,'ทีมที่ตอบตัวอักษรถูก')}${awardRow(i+'-or'+st.k,1,'ทีมที่ให้เหตุผลถูก')}`:`<button class="btn" type="button" id="oRv">เฉลย</button>`}</div>${pager(st.k,s.sets.length,'od')}${noteH(s)}`},
 bind(s,i){const st=S.x[i];bindPager(st,s.sets.length);if($('oRv'))$('oRv').onclick=()=>{st.rv[st.k]=1;save();rerender()}}},

/* ไพ่ความจำ: flip two numbered cards; a matching pair scores and the team keeps the turn */
memory:{html(s,i){const cards=s.pairs.flatMap(([a,b],p)=>[{p,t:a,k:'n'},{p,t:b,k:'f'}]);
  const st=X(i,{order:shuf(cards.map((_,k)=>k)),got:{},up:[],turn:0});const N=cards.length,pairsLeft=s.pairs.length-Object.keys(st.got).length/2;
  const two=st.up.length===2,match=two&&cards[st.order[st.up[0]]].p===cards[st.order[st.up[1]]].p;
  return head(s)+`<p class="rule">${esc(s.rule)}</p><div class="memwrap"><div class="mem">${st.order.map((ci,pos)=>{const c=cards[ci],g=st.got[pos],up=st.up.includes(pos);
     return `<button type="button" class="mc ${g!==undefined?'got':up?'up':''} ${c.k}" data-mc="${pos}" ${g!==undefined||up||two?'disabled':''} style="${g!==undefined?'--c:'+(SOLO()?'#2F8A62':TCOL[g%TCOL.length]):''}">${g!==undefined||up?`<span>${esc(c.t)}</span>`:`<b>${pos+1}</b>`}</button>`}).join('')}</div>
   <div class="memside">${pairsLeft?teamTurn(st.turn):'<div class="valbig"><b>ครบ!</b></div>'}<p class="note">เหลือ ${pairsLeft} คู่ · คู่ละ ${s.pts} แต้ม</p>
    ${two?(match?`<div class="rule" style="border-color:var(--good)">จับคู่ถูก! ${SOLO()?'เลขที่ '+(S.pick.last||'')+' ได้เปิดต่อ':esc(S.teams[st.turn%S.teams.length].n)+' +'+s.pts+' และได้เปิดต่อ'}</div><button class="btn" type="button" id="mKeep">เก็บคู่นี้</button>`
      :`<div class="rule" style="border-color:var(--bad)">ไม่ใช่คู่กัน จำตำแหน่งไว้!</div><button class="btn" type="button" id="mBack">คว่ำไพ่ ส่งต่อทีมถัดไป</button>`):'<p class="note">ทีมที่ถึงตาบอกหมายเลขไพ่ 2 ใบ ครูกดเปิด</p>'}</div></div>${noteH(s)}`},
 bind(s,i){const st=S.x[i];
  document.querySelectorAll('[data-mc]').forEach(b=>b.onclick=()=>{if(st.up.length<2){st.up.push(+b.dataset.mc);save();rerender()}});
  if($('mKeep'))$('mKeep').onclick=()=>{st.up.forEach(p=>st.got[p]=st.turn);st.up=[];if(!SOLO())addPts(st.turn%S.teams.length,s.pts);save();rerender()};
  if($('mBack'))$('mBack').onclick=()=>{st.up=[];st.turn=(st.turn+1)%S.teams.length;save();rerender()}}}

/* จัดหมวดภัย: one item at a time, everyone shows a coloured card, the revealed item drops into its bucket */
,sort:{html(s,i){const st=X(i,{k:0,rv:{}});const it=s.items[st.k],rv=st.rv[st.k];
  const placed=s.items.map((x,k)=>({x,k})).filter(o=>st.rv[o.k]);
  return head(s)+`<p class="rule">${esc(s.rule)}</p><div class="sortw"><div class="sortq ${rv?'done':''}"><small>ข้อ ${st.k+1} / ${s.items.length}</small><b>${esc(it[0])}</b>${rv?`<span class="tag t${it[1]}" style="background:${BC[it[1]]}">${esc(s.cats[it[1]])}</span><div class="x">${esc(it[2]||'')}</div>${awardRow(i+'-s'+st.k,s.pts,'ทีมที่ชูป้ายถูก')}`:`<button class="btn" type="button" id="sRv">เฉลย</button>`}</div>
   <div class="buckets" style="grid-template-columns:repeat(${Math.min(s.cats.length,3)},1fr)">${s.cats.map((c,ci)=>`<div class="bucket"><div class="bh" style="background:${BC[ci]}">${esc(c)}</div>${placed.filter(o=>o.x[1]===ci).map(o=>`<span>${esc(o.x[0])}</span>`).join('')}</div>`).join('')}</div></div>${pager(st.k,s.items.length,'so')}${noteH(s)}`},
 bind(s,i){const st=S.x[i];bindPager(st,s.items.length);if($('sRv'))$('sRv').onclick=()=>{st.rv[st.k]=1;save();rerender()}}}

/* สายลับ: 2 จริง 1 เท็จ */
,lie:{html(s,i){const st=X(i,{k:0,rv:{}});const [items,lie,x]=s.sets[st.k],rv=st.rv[st.k];
  return head(s)+`<p class="rule">${esc(s.rule)}</p><div class="lies">${items.map((t,n)=>`<div class="liec ${rv?(n===lie?'lie':'truth'):''}"><b>${n+1}</b><span>${esc(t)}</span>${rv?`<em>${n===lie?'เท็จ':'จริง'}</em>`:''}</div>`).join('')}</div>
   <div style="margin-top:.6em">${rv?`<div class="rule" style="border-color:var(--bad)">ข้อเท็จคือข้อ ${lie+1} · ${esc(x)}</div>${awardRow(i+'-l'+st.k,s.pts,'ทีมที่จับโกหกได้')}`:`<button class="btn" type="button" id="lRv">เปิดโปง</button>`}</div>${pager(st.k,s.sets.length,'li')}${noteH(s)}`},
 bind(s,i){const st=S.x[i];bindPager(st,s.sets.length);if($('lRv'))$('lRv').onclick=()=>{st.rv[st.k]=1;save();rerender()}}}

/* ห้องบัญชาการวิกฤต: a crisis card with a burning fuse; teams pick the mechanism code */
,mission:{html(s,i){const st=X(i,{k:0,rv:{},go:{}});const [sc,ans,x]=s.cases[st.k],rv=st.rv[st.k];
  return head(s)+`<p class="rule">${esc(s.rule)}</p><div class="msn"><div class="crisis"><div class="ch"><span>${ic('radar')} วิกฤตที่ ${st.k+1} / ${s.cases.length}</span><span class="fuse"><i id="fuse"></i></span></div><div class="ct2">${esc(sc)}</div>
    ${rv?`<div class="x" style="margin-top:.4em"><b style="color:var(--good)">${esc(s.tools[ans][0])} · ${esc(s.tools[ans][1])}</b><br>${esc(x)}</div>${awardRow(i+'-ms'+st.k,s.pts,'ทีมที่เลือกกลไกถูก')}`
      :`<div class="tfnav" style="justify-content:flex-start"><button class="btn" type="button" id="mGo">${ic('clock')}จับเวลา ${s.sec} วินาที</button><button class="btn ghost" type="button" id="mRv" style="color:var(--ink);border-color:#9AA8B5">เฉลย</button></div>`}</div>
   <div class="tools2">${s.tools.map((t,n)=>`<div class="tool ${rv?(n===ans?'ok':'dim'):''}"><b>${LET[n]}</b><span>${esc(t[0])}<small>${esc(t[1])}</small></span></div>`).join('')}</div></div>${pager(st.k,s.cases.length,'mi')}${noteH(s)}`},
 bind(s,i){const st=S.x[i];bindPager(st,s.cases.length);if($('mGo'))$('mGo').onclick=()=>{st.go[st.k]=1;save();QT.start(s.sec)};if($('mRv'))$('mRv').onclick=()=>{st.rv[st.k]=1;save();rerender()}}}

/* บิงโก: everyone draws a 3x3 grid from the term bank, the teacher draws definition clues */
,bingo:{html(s,i){const st=X(i,{left:shuf(s.terms.map((_,k)=>k)),called:[],show:false});const cur=st.called[st.called.length-1];
  return head(s)+`<p class="rule">${esc(SOLO()?s.ruleSolo:s.rule)}</p><div class="bingo"><div><div class="bank">${s.terms.map((t,k)=>`<span class="${st.called.includes(k)&&st.called[st.called.length-1]!==k||st.called.includes(k)&&st.show?'called':''}">${esc(t[0])}</span>`).join('')}</div>
   <div class="bgrid" aria-hidden="true">${Array.from({length:9},()=>'<i></i>').join('')}</div><p class="note" style="font-size:.62em">ตัวอย่างตาราง 3×3 ให้นักเรียนวาดลงกระดาษ แล้วเลือกคำจากคลังคำ 9 คำ ไม่ซ้ำกัน</p></div>
   <div><div class="bclue">${cur===undefined?`<small>กดจับสลากคำใบ้</small><b>?</b>`:`<small>คำใบ้ที่ ${st.called.length} / ${s.terms.length}</small><b>${esc(s.terms[cur][1])}</b>${st.show?`<span class="tag t0">${esc(s.terms[cur][0])}</span>`:''}`}</div>
    <div class="tfnav" style="justify-content:flex-start"><button class="btn" type="button" id="bDraw" ${st.left.length?'':'disabled'}>${ic('dice')}จับคำใบ้ต่อไป</button>${cur!==undefined&&!st.show?`<button class="btn ghost" type="button" id="bShow">เฉลยคำ</button>`:''}</div>
    <p class="note">เรียกแล้ว ${st.called.length} คำ: ${st.called.slice(0,-1).map(k=>esc(s.terms[k][0])).join(' · ')||'-'}</p>
    ${awardRow(i+'-b1',5,'บิงโกแรก')}${awardRow(i+'-b2',3,'บิงโกที่ 2')}${awardRow(i+'-b3',1,'บิงโกถัดไป')}</div></div>${noteH(s)}`},
 bind(s,i){const st=S.x[i];if($('bDraw'))$('bDraw').onclick=()=>{if(!st.left.length)return;st.called.push(st.left.pop());st.show=false;save();rerender()};if($('bShow'))$('bShow').onclick=()=>{st.show=true;save();rerender()}}}

/* ร้านค้าไร้พรมแดน: work out the selling price after import tax */
,calc:{html(s,i){const st=X(i,{k:0,rv:{}});const [name,c,price,rate,note]=s.rounds[st.k],rv=st.rv[st.k],tax=price*rate/100;

const resCode=(name,room,no,score)=>code5([PERIOD.code,clean(name),clean(room).replace(/\s/g,''),String(no).trim(),score,'asean-insight-2569'].join('|'));

function rooms(){try{return JSON.parse(LS.getItem('aseanRooms')||'null')||{last:'',r:{}}}catch(e){return {last:'',r:{}}}}

function defTeams(){return PERIOD.teams.map(([n,f])=>({n,f,p:0,m:null}))}
function fresh(room){const R=rooms();room=room??R.last??'';const c=roomCfg(room);
  const teams=c.teams&&c.teams.length?c.teams.map(t=>({n:t.n,f:t.f||[],m:t.m||null,p:0})):defTeams();
  return {stage:0,room,total:c.total,absent:c.absent,mode:c.mode,by:c.by,val:c.val,teams,aw:{},tfI:0,tfR:{},rv:{},jUsed:{},seen:[0],ord:{},x:{},pick:{left:[],last:null,hist:[]}}}

function present(){const ab=new Set(String(S.absent||'').split(/[^0-9]+/).filter(Boolean).map(Number));const out=[];for(let k=1;k<=(+S.total||0);k++)if(!ab.has(k))out.push(k);return out}
function groupOf(no){const k=S.teams.findIndex(t=>t.m&&t.m.includes(no));return k}
function teamName(k,N){if(N<=PERIOD.teams.length)return {n:PERIOD.teams[k][0],f:PERIOD.teams[k][1]};if(N<=11)return {n:'ทีม'+CNAME[ALLC[k]],f:[ALLC[k]]};return {n:'กลุ่ม '+(k+1),f:[]}}
function randomGroups(){const p=shuf(present());if(!p.length)return;let N=S.by==='n'?+S.val:Math.ceil(p.length/(+S.val||1));N=Math.max(2,Math.min(12,N,p.length));
  const g=Array.from({length:N},()=>[]);p.forEach((no,k)=>g[k%N].push(no));
  S.teams=g.map((m,k)=>({...teamName(k,N),p:0,m:m.sort((a,b)=>a-b)}));S.aw={};S.x={};S.jUsed={}}

/* visuals: 'scene:x', 'map:a,b', 'flag:x' */
function vis(spec,cap,cls=''){

  if(k==='map')h=mapSvg({mode:'hl',hl:v.split(',')}).replace(/<image[^>]*\/><rect[^>]*\/><text[^>]*>[^<]*<\/text>/g,'');

/* ---------- teacher ---------- */
let tick=null,clockLeft=0,clockRun=false;
function teacher(){
  S=load()||fresh();S.x=S.x||{};if(S.mode===undefined){const f=fresh(S.room);['room','total','absent','mode','by','val','pick'].forEach(k=>S[k]=f[k])}S.pick=S.pick||{left:[],last:null,hist:[]};
  $("root").innerHTML=`<div class="T"><div class="top"><div class="brand">คาบ ${PERIOD.n} · <b>${esc(PERIOD.title)}</b><small>${esc(PERIOD.unit)}</small></div>
   <button class="tbtn clock" type="button" id="clock" title="จับเวลาช่วงนี้ (กดเริ่ม/หยุด)">${ic('clock')}<span id="clk">0:00</span></button>
   <button class="tbtn" type="button" id="clkR" title="ตั้งเวลาใหม่">↺</button>
   <button class="tbtn" type="button" id="qtTop" title="จับเวลาตอบคำถาม หยุดได้ ไม่เฉลยเอง">${ic('clock')}<span>จับเวลาข้อ</span></button>
   <button class="tbtn" type="button" id="pickTop">${ic('dice')}<span>สุ่มเลขที่</span></button>
   <button class="tbtn" type="button" id="fs">${ic('full')}<span>เต็มจอ</span></button>
   <button class="tbtn" type="button" id="menu">${ic('back')}<span>หน้าแรก</span></button></div>
   <nav class="rail" id="rail" aria-label="ช่วงของคาบ"></nav>
   <div class="stageWrap"><button class="nav" type="button" id="prev" aria-label="ช่วงก่อนหน้า">‹</button><main class="stage" id="stage"></main><button class="nav" type="button" id="next" aria-label="ช่วงถัดไป">›</button></div>
   <div class="tbar" id="tbar"></div></div>`;
  $('prev').onclick=()=>go(S.stage-1);$('next').onclick=()=>go(S.stage+1);
  $('fs').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}};
  $('menu').onclick=()=>{nav(PH())};$('pickTop').onclick=()=>pickNo(true);$('qtTop').onclick=()=>QT.open();
  $('clock').onclick=()=>{clockRun=!clockRun};$('clkR').onclick=()=>{resetClock();clockRun=false};
  clearInterval(tick);tick=setInterval(()=>{if(!clockRun)return;clockLeft--;paintClock();if(clockLeft<=0)clockRun=false},1000);
  resetClock();renderStage();renderBar();
}
function resetClock(){clockLeft=(PERIOD.stages[S.stage].min||1)*60;paintClock()}
function paintClock(){const e=$('clk');if(!e)return;const s=Math.max(0,clockLeft);e.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');$('clock').classList.toggle('low',clockRun&&s<=30)}
function go(i){if(i<0||i>=PERIOD.stages.length)return;clearInterval(window.__hs);S.stage=i;if(!S.seen.includes(i))S.seen.push(i);save();clockRun=false;resetClock();renderStage();$('stage').scrollTop=0}
function renderRail(){
  $('rail').innerHTML=PERIOD.stages.map((s,i)=>`<button type="button" data-g="${i}" class="${i===S.stage?'now':S.seen.includes(i)?'done':''}"><b>${i+1}</b><span>${esc(s.k)}</span></button>`).join('');
  $('rail').querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>go(+b.dataset.g));
  const now=$('rail').querySelector('.now');if(now)now.scrollIntoView({block:'nearest',inline:'nearest'});
  $('prev').disabled=S.stage===0;$('next').disabled=S.stage===PERIOD.stages.length-1;
}
function renderBar(bumpI){
  if(SOLO()){$('tbar').classList.remove('many');const P=S.pick,n=present().length,left=P.left.length||n;
    $('tbar').innerHTML=`<div class="pbar"><button class="btn" type="button" id="pickB">${ic('dice')}สุ่มเลขที่ผู้ตอบ</button><span class="plast">${P.last?`เลขที่ <b>${P.last}</b>`:'ยังไม่ได้สุ่ม'}</span><span class="phist">${P.hist.slice(-12).reverse().map(x=>`<i>${x}</i>`).join('')}</span><span class="pleft">รายบุคคล · มาเรียน ${n} คน · เหลือยังไม่ถูกเรียก ${P.left.length?P.left.length:n}</span></div>`;
    $('pickB').onclick=()=>pickNo(true);return}
  $('tbar').classList.toggle('many',S.teams.length>6);$('tbar').classList.remove('solo');
  $('tbar').innerHTML=S.teams.map((t,i)=>`<div class="tchip" style="--c:${TCOL[i]}"><span class="fls">${t.f.map(c=>`<img src="${FLAG[c]}" alt="">`).join('')}</span><span class="nm" title="${esc(t.n)}${t.m?' · เลขที่ '+t.m.join(', '):''}">${esc(t.n.replace(/^ทีม\s*/,''))}</span>
   <button type="button" data-m="${i}" aria-label="ลบ 1 แต้ม ${esc(t.n)}">−</button><span class="pt ${bumpI===i?'bump':''}">${t.p}</span><button type="button" data-p="${i}" aria-label="เพิ่ม 1 แต้ม ${esc(t.n)}">+</button></div>`).join('');
  $('tbar').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>addPts(+b.dataset.p,1));
  $('tbar').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>addPts(+b.dataset.m,-1));
}
function addPts(i,n){S.teams[i].p=Math.max(0,S.teams[i].p+n);save();renderBar(i)}
/* award buttons: key identifies the question so a team can be toggled on/off without double counting */
function awardRow(key,pts,label='ทีมที่ได้แต้ม'){
  if(SOLO())return '';
  const on=S.aw[key]||{};
  return `<div class="award" data-key="${key}" data-pts="${pts}"><span>${label} (+${pts}):</span>${S.teams.map((t,i)=>`<button type="button" class="aw ${on[i]?'on':''}" style="--c:${TCOL[i]}" data-t="${i}"><i>${i+1}</i>${esc(t.n.replace(/^ทีม/,''))}</button>`).join('')}</div>`;
}
function bindAwards(root=document){
  root.querySelectorAll('.award').forEach(row=>{const key=row.dataset.key,pts=+row.dataset.pts;
    row.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const i=+b.dataset.t;S.aw[key]=S.aw[key]||{};const was=!!S.aw[key][i];S.aw[key][i]=!was;addPts(i,was?-pts:pts);b.classList.toggle('on',!was);save()})});
}
function head(s){return `<div class="kick">${esc(s.k)}<i>${s.min} นาที</i></div><h1 class="h">${esc(s.h)}</h1>`}
const noteH=s=>s.n?`<details class="note"><summary>บันทึกสำหรับครู</summary>${esc(s.n)}</details>`:'';
function renderStage(){
  renderRail();const s=PERIOD.stages[S.stage],i=S.stage;let h='';
  if(s.t==='cover')h=`<div class="cover">${s.raw||vis(s.vis||'scene:signing',s.cap||'ภาพวาดจำลอง ไม่ใช่ภาพถ่ายบุคคลจริง')}<div class="kick" style="justify-content:center;margin-top:.6em">${esc(s.k)} · คาบที่ ${PERIOD.n} · ${esc(PERIOD.lo)}</div><h1 class="h">${esc(s.h)}</h1><p class="s">${esc(s.s)}</p>
     <div class="goals">${PERIOD.goals.map((g,k)=>`<div><b>${k+1}</b>${esc(g)}</div>`).join('')}</div>
     <div class="plan">${PERIOD.stages.map((x,k)=>`<span>${k+1}. ${esc(x.k)} ${x.min}′</span>`).join('')}</div></div>${noteH(s)}`;
  if(s.t==='teams')h=teamsStage(s);
  if(s.t==='teams_old')h=head(s)+`<div class="tedit">${S.teams.map((t,k)=>`<label style="--c:${TCOL[k]}"><span class="no">${k+1}</span>${t.f.map(fl).join('')}<input data-tn="${k}" value="${esc(t.n)}" aria-label="ชื่อทีม ${k+1}"></label>`).join('')}</div>
     <div class="cnt">จำนวนทีม <button class="btn light" type="button" id="tMinus" ${S.teams.length<=2?'disabled':''}>−</button><b>${S.teams.length}</b><button class="btn light" type="button" id="tPlus" ${S.teams.length>=8?'disabled':''}>+</button>
     <button class="btn ghost" type="button" id="tReset" style="margin-left:auto">ล้างคะแนนทุกทีม</button></div>
     <p class="rule">แต้มทีมสะสมทุกเกมในคาบนี้ แสดงที่แถบด้านล่าง กด + / − แก้ไขได้ตลอด ท้ายคาบระบบสรุปอันดับ ดาว ASEAN Cup และคะแนนเก็บกลุ่มให้</p>${noteH(s)}`;
  if(s.t==='buzz')h=head(s)+`<p class="rule">${esc(s.rule)}</p><div class="two">${vis(s.vis,s.cap)}<div class="qlist">${s.qs.map(([q,a],k)=>{const key=i+'-'+k,rv=S.rv[key];
     return `<div class="qitem"><div class="q"><i>${k+1}</i>${esc(q)}</div>${rv?`<div class="a">${esc(a)}</div>${awardRow(key,s.pts)}`:`<button class="rev" type="button" data-rv="${key}">เฉลย</button>`}</div>`}).join('')}</div></div>${noteH(s)}`;
  if(s.t==='content')h=head(s)+`<div class="two ${s.signers?'sig':''}">${s.raw?`<div>${s.raw}</div>`:vis(s.vis,s.cap)}<div><ul class="pts">${s.pts.map((p,k)=>`<li data-n="${k+1}">${p}</li>`).join('')}</ul>${s.ask?`<div class="ask">${ic('bulb')} ${esc(s.ask)}</div>`:''}</div></div>
     ${s.signers?`<div class="signers">${s.signers.map(([c,n,r])=>`<div class="signer"><img src="${FLAG[c]}" alt="ธง${CNAME[c]}"><b>${esc(n)}</b>${CNAME[c]}<br>${esc(r)}</div>`).join('')}</div>`:''}${noteH(s)}`;
  if(s.t==='tf'){const k=Math.min(S.tfI,s.qs.length-1),[st,a,x]=s.qs[k],key=i+'-'+k,rv=S.rv[key];
    h=head(s)+`<p class="rule">${esc(s.rule)}</p><div class="tfbig"><div class="num">ข้อ ${k+1} / ${s.qs.length}</div><div class="st">${esc(st)}</div>
     ${rv?`<div class="verdict ${a?'t':'f'}">${a?'✓ ถูก':'✗ ผิด'}</div><div class="x">${esc(x)}</div>${awardRow(key,s.pts,'ทีมที่ชูป้ายถูก')}`:`<button class="btn" type="button" data-rv="${key}">เฉลย</button>`}</div>
     <div class="tfnav"><button class="btn ghost" type="button" id="tfP" ${k===0?'disabled':''}>‹ ข้อก่อน</button><button class="btn ghost" type="button" id="tfN" ${k===s.qs.length-1?'disabled':''}>ข้อถัดไป ›</button></div>${noteH(s)}`}
  if(s.t==='match'){const key=i+'';const order=S.ord[key]||(S.ord[key]=shuf(s.pairs.map(p=>p[1])));
    h=head(s)+`<p class="rule">${esc(s.rule)}</p><div class="flagrow">${order.map(c=>`<span><img src="${FLAG[c]}" alt="">${CNAME[c]}</span>`).join('')}</div>
     <div class="mgrid">${s.pairs.map(([n,c],k)=>{const r=S.rv[i+'-'+k];return `<div class="mrow ${r?'':'hide'}"><span class="n">${k+1}</span>${esc(n)}<span class="ans">${r?fl(c)+CNAME[c]:''}</span>${r?'':`<button class="rev" type="button" data-rv="${i}-${k}" style="margin:0 0 0 auto">เฉลย</button>`}</div>`}).join('')}</div>
     ${s.pairs.every((_,k)=>S.rv[i+'-'+k])?awardRow(i+'-m1',1,'ทีมที่ถูก 1–2 คู่')+awardRow(i+'-m3',3,'ทีมที่ถูก 3–4 คู่')+awardRow(i+'-m5',5,'ทีมที่ถูกครบ 5 คู่'):`<p class="note">เฉลยครบทุกคู่แล้ว ปุ่มให้แต้มจะปรากฏ</p>`}${noteH(s)}`;}
  if(s.t==='order'){const key=i+'';const order=S.ord[key]||(S.ord[key]=shuf(s.items.map((_,k)=>k)));const rv=S.rv[key];
    h=head(s)+`<p class="rule">${esc(s.rule)}</p><div class="ocards">${order.map((k,pos)=>`<div class="ocard ${rv?'rv':''}"><span class="L">${LET[pos]}</span>${esc(s.items[k][1])}${rv?`<span class="y">${s.items[k][0]}</span><span class="rank">ลำดับ ${k+1}</span>`:''}</div>`).join('')}</div>
     <div style="margin-top:.7em">${rv?`<div class="rule" style="border-color:var(--good)">ลำดับที่ถูก: ${s.items.map((_,k)=>LET[order.indexOf(k)]).join(' – ')}</div>`+awardRow(key+'-a',s.pts,'ทีมที่เรียงถูกทั้งหมด')+awardRow(key+'-b',1,'ทีมที่ผิด 1 ตำแหน่ง'):`<button class="btn" type="button" data-rv="${key}">เฉลยลำดับ</button>`}</div>${noteH(s)}`;}
  if(s.t==='jeop')h=head(s)+`<p class="rule">${esc(s.rule)}</p><div class="jboard">${s.cats.map(c=>`<div class="jcat">${esc(c[0])}</div>`).join('')}
     ${[0,1,2].map(r=>s.cats.map((c,ci)=>{const key=i+'-'+ci+'-'+r,u=S.jUsed[key];return `<button class="jt" type="button" data-j="${ci}-${r}" ${u!==undefined?'disabled':''} aria-label="${esc(c[0])} ${c[1][r][0]} แต้ม">${c[1][r][0]}${u!==undefined?`<span class="won">${u>=0?`<i style="--c:${TCOL[u]}">${u+1}</i>`:SOLO()?'ใช้แล้ว':'ไม่มีทีมได้'}</span>`:''}</button>`}).join('')).join('')}</div>${noteH(s)}`;
  if(s.t==='exit')h=head(s)+`<p class="rule">ทุกคนทำคนเดียว ${PERIOD.exit.qs.length} ข้อ ข้อละ ${PERIOD.exit.sec} วินาที ถูก ${PERIOD.exit.pass} ข้อขึ้นไปได้ตราวีซ่าคาบที่ ${PERIOD.n} (1 คะแนนเก็บ)</p>
     <div class="steps"><div class="step"><b>1</b>เปิด Google Classroom ในมือถือ กดลิงก์ <b style="display:inline;background:none;width:auto;height:auto">คาบ ${PERIOD.n}</b> ที่ครูแปะไว้</div><div class="step"><b>2</b>กดปุ่ม <u>นักเรียน</u> กรอกชื่อ ชั้น เลขที่ แล้วเริ่มเกม</div><div class="step"><b>3</b>${esc(PERIOD.exit.how||'ตอบให้ทันเวลา อ่านคำอธิบายหลังตอบทุกข้อ')}</div><div class="step"><b>4</b>กด "คัดลอกผล" แล้ววางส่งในงาน <u>ส่งผล${EXN} คาบ ${PERIOD.n}</u> ใน Classroom</div></div>
     <div class="big1">ไม่มีมือถือ?</div><p class="rule">จับคู่ใช้เครื่องเพื่อนต่อจากเพื่อนทำเสร็จ หรือเขียน Exit Ticket ใน Passport: <b>${esc(PERIOD.exit.alt)}</b></p>
     <div class="tools"><button class="btn" type="button" id="tryS">${ic('play')}ลองเล่นแบบนักเรียน</button></div>${noteH(s)}`;
  if(s.t==='summary'&&SOLO())h=head(s)+`<div class="two" style="align-items:start"><div><ul class="pts">${s.sum.map((p,k)=>`<li data-n="${k+1}">${esc(p)}</li>`).join('')}</ul><p class="rule" style="margin-top:.8em">คาบนี้เรียนแบบรายบุคคล คะแนนเก็บมาจากเกมเดี่ยว "${EXN}" ตรวจรหัสได้ทางขวา</p></div>
      <div class="verify"><div class="big1" style="margin-top:0">ตรวจผลเกมเดี่ยวจาก Classroom</div><textarea id="vin" placeholder="วางข้อความผลที่นักเรียนส่งมา บรรทัดละ 1 คน"></textarea>
      <div class="tools"><button class="btn" type="button" id="vgo">ตรวจรหัส</button><button class="btn ghost" type="button" id="vcopy" hidden>คัดลอกตารางที่ตรวจแล้ว</button></div><div id="vout"></div></div></div>${noteH(s)}`;
  else if(s.t==='summary'){const rank=S.teams.map((t,k)=>({...t,k})).sort((a,b)=>b.p-a.p);
    const place=t=>rank.filter(x=>x.p>t.p).length+1;const stars=p=>p===1?'★★★':p===2?'★★':p===3?'★':'';const sc=p=>p===1?5:p<=3?4:3;
    h=head(s)+`<div class="two" style="align-items:start"><div><div class="lb">${rank.map(t=>{const pl=place(t);return `<div class="lbr ${pl===1?'r1':''}"><span class="r">${pl}</span><span class="nm">${t.f.map(fl).join('')}${esc(t.n)}</span><span class="p">${t.p}</span><span class="stars">${stars(pl)}</span><span class="sc">คะแนนเก็บกลุ่ม ${sc(pl)}/5</span></div>`}).join('')}</div>
      <p class="note" style="font-size:.62em">ดาว ASEAN Cup: อันดับ 1 = 3 ดาว · 2 = 2 ดาว · 3 = 1 ดาว · คะแนนเก็บกลุ่ม (เต็ม 5): อันดับ 1 = 5 · อันดับ 2–3 = 4 · ทีมที่ร่วมกิจกรรมครบ = 3 · คะแนนเท่ากันได้อันดับเดียวกัน</p>
      <div class="tools"><button class="btn" type="button" id="copyT">${ic('note')}คัดลอกคะแนนทีม</button>${S.teams.some(t=>t.m)?`<button class="btn" type="button" id="copyP">${ic('users')}คัดลอกคะแนนรายคน (เรียงเลขที่)</button>`:''}<button class="btn ghost" type="button" id="newClass">เริ่มห้องใหม่</button></div></div>
      <div><ul class="pts">${s.sum.map((p,k)=>`<li data-n="${k+1}">${esc(p)}</li>`).join('')}</ul>
      <div class="verify" style="margin-top:.8em"><div class="big1" style="margin-top:0">ตรวจผลเกมเดี่ยวจาก Classroom</div><textarea id="vin" placeholder="วางข้อความผลที่นักเรียนส่งมา บรรทัดละ 1 คน เช่น&#10;คาบ ${PERIOD.n} | ชื่อ สกุล | ม.4/1 | 12 | 8/10 | ผ่าน | รหัส ABCDE"></textarea>
      <div class="tools"><button class="btn" type="button" id="vgo">ตรวจรหัส</button><button class="btn ghost" type="button" id="vcopy" hidden>คัดลอกตารางที่ตรวจแล้ว</button></div><div id="vout"></div></div></div></div>${noteH(s)}`;}
  if(EXT[s.t])h=EXT[s.t].html(s,i);
  $('stage').innerHTML=`<div class="in">${h}</div>`;bindStage(s,i);
}
function bindStage(s,i){
  const st=$('stage');
  st.querySelectorAll('[data-rv]').forEach(b=>b.onclick=()=>{S.rv[b.dataset.rv]=1;save();const y=st.scrollTop;renderStage();st.scrollTop=y});
  bindAwards(st);
  st.querySelectorAll('[data-tn]').forEach(inp=>inp.oninput=()=>{S.teams[+inp.dataset.tn].n=inp.value||('ทีม '+(+inp.dataset.tn+1));save();renderBar()});
  if($('tPlus'))$('tPlus').onclick=()=>{const k=S.teams.length;S.teams.push({n:'ทีม '+(k+1),f:[],p:0});save();renderStage();renderBar()};

  document.querySelectorAll('.sopt').forEach(b=>{b.disabled=true;const v=+b.dataset.j;if(v===0)b.classList.add('ok');else if(v===j)b.classList.add('no')});
  if(q.seq){const r=$('seqR');if(r)r.remove();$('seqA').innerHTML=`<div style="font-size:14px;color:var(--muted)">ลำดับที่ถูก</div>`+q.seq.map((t,n)=>`<i class="${pick&&pick[n]===n?'ok':'no'}">${n+1}. ${esc(t)}</i>`).join('')}
  $('fb').innerHTML=`<div class="fb ${ok?'ok':'no'}"><b>${ok?'ถูกต้อง':j<0?'หมดเวลา':'ยังไม่ถูก'}</b> ${esc(q.x)}</div><button class="btn" type="button" id="sN" style="margin-top:12px;width:100%;font-size:17px;padding:11px">${E.i+1<E.qs.length?'ข้อถัดไป':'ดูผล'} ›</button>`;
  $('stk').textContent=E.streak>=2?'ตอบถูกติดกัน '+E.streak+' ข้อ!':'';
  $('sN').onclick=()=>{E.i++;if(E.i>=E.qs.length){E.done=true;sSave();sResult()}else{sSave();sQ()}};$('sN').focus();
  $('sN').scrollIntoView({block:'nearest',behavior:'smooth'});
}
function sResult(){
  const sc=E.ans.reduce((a,b)=>a+b,0),n=E.qs.length,pass=sc>=PERIOD.exit.pass,code=resCode(E.name,E.room,E.no,sc);
  const line=`คาบ ${PERIOD.n} | ${E.name} | ${clean(E.room)} | ${E.no} | ${sc}/${n} | ${pass?'ผ่าน':'ไม่ผ่าน'} | รหัส ${code}`;
  const miss=E.qs.map((it,k)=>E.ans[k]?null:PERIOD.exit.qs[it.k]).filter(Boolean);
  sShell(`<div class="scard"><div class="visa" style="--c:${pass?'var(--good)':'var(--bad)'}"><div class="stamp" style="--c:${pass?'#2F8A62':'#C9503A'}"><div><small>ASEAN VISA · คาบ ${PERIOD.n}</small><b>${pass?'ผ่าน':'ไม่ผ่าน'}</b><small>${sc}/${n} คะแนน</small></div></div>
   <div style="font-family:var(--display);font-size:19px">${pass?'ยินดีด้วย ทูต'+esc(E.name.split(' ')[0])+' ได้ตราวีซ่าแล้ว':'ยังไม่ผ่านด่าน ทบทวนข้อที่พลาดด้านล่าง'}</div>
   <div style="color:var(--muted);font-size:14.5px">ตอบถูกติดกันสูงสุด ${E.best} ข้อ</div></div>
   <div style="font-family:var(--display);margin-top:8px">ส่งผลให้ครู</div><div class="rline" id="rl">${esc(line)}</div>
   <button class="btn" type="button" id="cp" style="width:100%;font-size:17px;padding:11px">${ic('note')}คัดลอกผล</button>
   <p style="font-size:14.5px;color:var(--muted);line-height:1.55">กลับไปที่ Google Classroom เปิดงาน "ส่งผล${EXN} คาบ ${PERIOD.n}" วางข้อความนี้ในช่องคำตอบ แล้วกดส่ง ถ้าคัดลอกไม่ได้ ให้แคปหน้าจอนี้ส่งแทน</p>
   <button class="btn ghost" type="button" id="nextP" style="width:100%;margin-top:4px;color:var(--ink);border-color:#9AA8B5">ให้เพื่อนใช้เครื่องนี้ทำต่อ</button>
   ${miss.length?`<div class="review"><div style="border:0;font-family:var(--display)">ทบทวนข้อที่พลาด</div>${miss.map(q=>`<div>${esc(q.q)}<br>คำตอบ: <b>${esc(q.seq?q.seq.join(' → '):q.cat?q.cat.items.map(it=>it[0]+' = '+q.cat.labels[it[1]]).join(' · '):q.o[0])}</b><br><span style="color:var(--muted)">${esc(q.x)}</span></div>`).join('')}</div>`:''}</div>`,100);
  $('cp').onclick=()=>copyText(line,$('cp'));
  $('nextP').onclick=()=>confirmBox('ส่งผลของ '+E.name+' แล้วใช่ไหม? ผลบนเครื่องนี้จะถูกล้างเพื่อให้เพื่อนเริ่มใหม่',()=>{E=null;try{LS.removeItem(SKEY)}catch(e){}sForm()});
}

/* ---------- router ---------- */
function route(){clearInterval(sTick);clearInterval(window.__hs);const h=NAV.h;const m=h.match(/^p(\d+)(?:\/(teacher|student))?$/);if(!m||!PERIODS[+m[1]]){clearInterval(tick);QT.close();home();return}if(!PERIOD||PERIOD.n!==+m[1])setPeriod(+m[1]);if(m[2]==='teacher')teacher();else if(m[2]==='student'){QT.close();student()}else{clearInterval(tick);QT.close();entry()}window.scrollTo(0,0)}
window.addEventListener('hashchange',()=>{let h='';try{h=(location.hash||'').slice(1)}catch(e){}if(h!==NAV.h){NAV.h=h;route()}});
document.addEventListener('keydown',e=>{if(!/\/teacher$/.test(NAV.h)||e.target.matches('input,textarea')||document.querySelector('.ov'))return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(S.stage+1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(S.stage-1)}});
route();

</script></body></html>
